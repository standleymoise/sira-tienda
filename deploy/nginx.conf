# nginx para el sitio Astro dentro del contenedor (Dokploy). Equivale a public/.htaccess y
# public/_astro/.htaccess de Hostinger (nginx no lee .htaccess). HTTPS y www → sin www los hace
# Traefik/Cloudflare delante; aquí solo se sirve el sitio en el puerto 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás de Traefik: redirecciones relativas (sin :80 ni http://).
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # JS, CSS, fuentes y fotos optimizadas: el nombre cambia con cada versión → un año.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifiesto se revisan en cada visita (así un deploy se ve enseguida).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Logos, favicon e íconos sin hash en el nombre: un día.
    location ~* \.(?:svg|png|jpe?g|webp|avif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Páginas: se revisan en cada visita. /productos → /productos/ (301), como en Hostinger.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
